[package]
name = "aura-desktop"
version = "0.6.0-alpha.1"
description = "AURA-2 local-first personal AI assistant for Windows"
authors = ["Untoz"]
edition = "2021"

[lib]
name = "aura_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "blocking"] }
futures-util = "0.3"
fs2 = "0.4"
cpal = "0.18.2"
obws = "0.15.0"
tokio = { version = "1", features = ["sync", "time", "fs", "io-util"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-autostart = "2"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Power",
  "Win32_System_Shutdown",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging"
] }

windows = { version = "0.62", features = [
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com"
] }
