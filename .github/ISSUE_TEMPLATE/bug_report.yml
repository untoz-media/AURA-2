name: AURA-2 testing preview bug
description: Report a reproducible problem in the AURA-2 testing preview.
title: "[Preview Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing AURA-2. Do not include passwords, tokens, private prompts, personal files, screenshots containing sensitive data or OBS credentials.

        If possible, open Settings → Beta & Diagnostics, run the self-check and export the privacy-safe diagnostics snapshot.
  - type: input
    id: version
    attributes:
      label: AURA version
      placeholder: 0.9.0-beta.1
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build provenance
      description: Build label/source/commit shown in Settings → Beta & Diagnostics.
      placeholder: alpha-v1-testing-preview · github-release · abc123...
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. AURA ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include exact visible error text if available.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Privacy-safe diagnostics
      description: Paste only the diagnostics JSON you intentionally choose to share.
      render: json
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed this report and removed passwords, tokens, private prompts, personal files and other secrets.
          required: true
