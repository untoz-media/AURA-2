name: AURA-2 Beta bug report
description: Report a reproducible problem in the AURA-2 Beta.
title: "[Beta Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing AURA-2. Please do not include passwords, private prompts, personal files, screenshots containing sensitive data, OBS credentials, access tokens or other secrets.

        If possible, open **Settings → Diagnostics**, run **Core self-test**, then choose **Copy diagnostics** and paste that privacy-safe report below.

  - type: input
    id: version
    attributes:
      label: AURA version
      description: Shown in Settings → Diagnostics.
      placeholder: 0.9.0-beta.1
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Installer / startup
        - Chat / local model
        - Managed Runtime
        - Models / downloads
        - Computer Control
        - Memory / context
        - Voice
        - Vision
        - OBS / Director Mode
        - Agents
        - Automations
        - Settings / permissions
        - Overlay / shortcuts
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest sequence that reproduces the problem.
      placeholder: |
        1. Open ...
        2. Click ...
        3. AURA ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the exact visible error text if one was shown.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Privacy-safe AURA diagnostics
      description: Paste the report from Settings → Diagnostics. Remove anything you do not want to share.
      render: text

  - type: dropdown
    id: restart
    attributes:
      label: Does it still happen after restarting AURA?
      options:
        - Yes
        - No
        - Not tested
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Optional. Attach only screenshots/logs you intentionally choose to share.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked this report and removed passwords, tokens, private prompts, personal files and other secrets.
          required: true
