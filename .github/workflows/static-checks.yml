name: Static Checks

permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".github/workflows/static-checks.yml"
  workflow_dispatch:

jobs:
  validate:
    name: Runner assignment probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove GitHub-hosted runner starts
        run: |
          echo "AURA-2 runner probe started"
          uname -a
          node --version || true
          python --version || true
          cargo --version || true
