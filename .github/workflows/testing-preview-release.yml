name: AURA-2 Testing Preview Release

permissions:
  contents: write

on:
  push:
    branches:
      - "release/alpha-v1"
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RELEASE_ALPHA_V1 to confirm publication
        required: true
        default: ""

concurrency:
  group: aura-testing-preview-release
  cancel-in-progress: false

jobs:
  release-windows-preview:
    name: Build and publish Windows testing preview
    if: github.event_name == 'push' || github.event.inputs.confirmation == 'RELEASE_ALPHA_V1'
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      AURA_BUILD_COMMIT: ${{ github.sha }}
      AURA_BUILD_SOURCE: github-release
      AURA_BUILD_LABEL: alpha-v1-testing-preview

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      - name: Resolve dependency lockfile
        shell: pwsh
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact resolved dependencies
        shell: pwsh
        run: npm ci

      - name: Resolve Rust dependency lock
        run: cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Windows Build Doctor
        shell: pwsh
        run: npm run beta:doctor:windows

      - name: Testing preview structural gate
        run: npm run preview:release-check

      - name: Validate Beta source
        run: npm run beta:validate

      - name: Run Rust regression tests
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build Tauri + NSIS installer
        run: npm run build

      - name: Build release metadata
        shell: pwsh
        run: |
          $installer = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }

          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content "AURA-2-Windows-x64.sha256" -Encoding ascii

          $signature = Get-AuthenticodeSignature $installer.FullName
          $lockHash = (Get-FileHash "package-lock.json" -Algorithm SHA256).Hash.ToLower()
          $cargoLockHash = (Get-FileHash "apps/desktop/src-tauri/Cargo.lock" -Algorithm SHA256).Hash.ToLower()
          $version = (Get-Content "package.json" -Raw | ConvertFrom-Json).version

          $manifest = [ordered]@{
            schemaVersion = 3
            product = "AURA-2"
            version = $version
            distributionLabel = "AURA-2 Alpha v1 — Testing Preview"
            channel = "beta"
            installer = $installer.Name
            installerSizeBytes = $installer.Length
            sha256 = $hash
            signatureStatus = [string]$signature.Status
            sourceCommit = $env:AURA_BUILD_COMMIT
            buildSource = $env:AURA_BUILD_SOURCE
            buildLabel = $env:AURA_BUILD_LABEL
            packageLockSha256 = $lockHash
            cargoLockSha256 = $cargoLockHash
            workflowRunId = "${{ github.run_id }}"
            builtAtUtc = [DateTime]::UtcNow.ToString("o")
          }

          $manifest | ConvertTo-Json -Depth 4 | Set-Content "AURA-2-Testing-Preview-Build.json" -Encoding utf8

      - name: Verify release metadata
        shell: pwsh
        run: |
          $manifest = Get-Content "AURA-2-Testing-Preview-Build.json" -Raw | ConvertFrom-Json
          $installer = Join-Path "apps/desktop/src-tauri/target/release/bundle/nsis" $manifest.installer
          if (-not (Test-Path $installer)) { throw "Manifest installer missing" }
          $actualHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          if ($actualHash -ne ([string]$manifest.sha256).ToLower()) { throw "Installer checksum mismatch" }
          $lockHash = (Get-FileHash "package-lock.json" -Algorithm SHA256).Hash.ToLower()
          if ($lockHash -ne ([string]$manifest.packageLockSha256).ToLower()) { throw "npm dependency lock checksum mismatch" }
          $cargoLockHash = (Get-FileHash "apps/desktop/src-tauri/Cargo.lock" -Algorithm SHA256).Hash.ToLower()
          if ($cargoLockHash -ne ([string]$manifest.cargoLockSha256).ToLower()) { throw "Cargo dependency lock checksum mismatch" }
          if ($manifest.sourceCommit -ne $env:AURA_BUILD_COMMIT) { throw "Build provenance mismatch" }

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aura-alpha-v1
          target_commitish: ${{ github.sha }}
          name: AURA-2 Alpha v1 — Testing Preview
          body_path: docs/ALPHA-V1-TESTING-PREVIEW.md
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            AURA-2-Windows-x64.sha256
            AURA-2-Testing-Preview-Build.json
            package-lock.json
            apps/desktop/src-tauri/Cargo.lock
