name: Windows Build

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "package.json"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "aura-v*"

jobs:
  build-windows:
    name: Build Windows NSIS installer
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      - name: Install dependencies
        run: npm install

      - name: Generate Tauri icons
        run: npm run icons

      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Test Rust Core
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build AURA-2
        run: npm run build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: AURA-2-Windows-x64
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content "AURA-2-Windows-x64.sha256"

      - name: Upload installer checksum
        uses: actions/upload-artifact@v4
        with:
          name: AURA-2-Windows-x64-SHA256
          path: AURA-2-Windows-x64.sha256
          if-no-files-found: error
          retention-days: 14
