name: Windows Build

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "aura-v*"

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows NSIS installer
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      - name: Install dependencies
        run: npm install

      - name: Validate release metadata
        run: npm run release:check

      - name: Validate Beta source guardrails
        run: npm run beta:source-check

      - name: Test Rust Core
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build AURA-2
        run: npm run build

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "AURA-2 NSIS installer was not produced."
          }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -NoNewline "$($installer.FullName).sha256"
          Write-Host "Installer: $($installer.Name)"
          Write-Host "SHA-256: $hash"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: AURA-2-Windows-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sha256
          if-no-files-found: error
          retention-days: 14
